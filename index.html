<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - CRM DTHT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- FIREBASE SDK COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #FFF7ED 0%, #F0FDF4 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border-4 border-orange-200 p-8 relative overflow-hidden">
        <!-- Họa tiết trang trí -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-100 rounded-full blur-xl opacity-70"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-green-100 rounded-full blur-xl opacity-70"></div>

        <div class="text-center relative z-10 mb-8">
            <div class="w-20 h-20 bg-orange-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg text-white text-3xl font-bold border-4 border-orange-200">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-orange-600 tracking-wide">CRM DTHT</h1>
            <p class="text-xs font-semibold text-green-600 mt-1">Hệ thống quản lý dạy thêm học thêm Thần Đồng Siêu Nhí</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Tài khoản / Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-orange-400"></i>
                    <input type="email" id="email" required placeholder="tuannv@thandong.com" 
                        class="w-full pl-11 pr-4 py-3 border-2 border-orange-100 rounded-2xl focus:outline-none focus:border-orange-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Mật khẩu</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-orange-400"></i>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full pl-11 pr-4 py-3 border-2 border-orange-100 rounded-2xl focus:outline-none focus:border-orange-500 transition-colors">
                </div>
            </div>

            <button type="submit" id="btnLogin"
                class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:from-orange-600 hover:to-amber-600 transform hover:-translate-y-0.5 transition-all text-lg flex justify-center items-center">
                <span><i class="fa-solid fa-right-to-bracket mr-2"></i>Đăng Nhập</span>
            </button>
        </form>
    </div>

    <script>
        // CẤU HÌNH FIREBASE SDK CHÍNH THỨC DÙNG CHO TRÌNH DUYỆT (COMPAT)
        const firebaseConfig = {
            apiKey: "AIzaSyCkSi4oAEcluPU8GyXjoE3NgdWsgxtUd0w",
            authDomain: "dtht-4e969.firebaseapp.com",
            projectId: "dtht-4e969",
            storageBucket: "dtht-4e969.firebasestorage.app",
            messagingSenderId: "877808371845",
            appId: "1:877808371845:web:dabb14af96e9a1458f41ec",
            measurementId: "G-N01WPE9KPH"
        };

        firebase.initializeApp(firebaseConfig);
        const firestoreDb = firebase.firestore();

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerHTML = '<span><i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang kiểm tra...</span>';

            // 1. Kiểm tra Admin
            if (email === 'admin@thandong.com' && pass === 'Rich@2007') {
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('userEmail', email);
                window.location.href = 'dashboard.html';
                return;
            }

            // 2. Lấy dữ liệu danh sách Giáo viên từ Cloud Firestore
            try {
                const docSnap = await firestoreDb.collection('crm_dt_db').doc('main_data').get();
                let staffList = [];
                
                if (docSnap.exists) {
                    staffList = docSnap.data().staffs || [];
                }

                // Tìm tài khoản giáo viên/nhân viên
                const found = staffList.find(s => s.email === email && s.password === pass);

                if (found) {
                    localStorage.setItem('userRole', found.role);
                    localStorage.setItem('userEmail', found.email);
                    localStorage.setItem('userName', found.fullName);
                    
                    // Chuyển hướng sang teacher.html
                    window.location.href = 'teacher.html';
                } else {
                    alert('Tài khoản hoặc mật khẩu không đúng! Hãy kiểm tra lại email hoặc mật khẩu do Admin cấp.');
                    btn.disabled = false;
                    btn.innerHTML = '<span><i class="fa-solid fa-right-to-bracket mr-2"></i>Đăng Nhập</span>';
                }
            } catch (err) {
                console.error("Lỗi khi kết nối Firebase:", err);
                alert('Có lỗi xảy ra khi kết nối cơ sở dữ liệu Cloud. Vui lòng kiểm tra lại kết nối mạng!');
                btn.disabled = false;
                btn.innerHTML = '<span><i class="fa-solid fa-right-to-bracket mr-2"></i>Đăng Nhập</span>';
            }
        }
    </script>
</body>
</html>
